name: 💡 Proposer une amélioration
description: Une idée pour améliorer le kart ou le dépôt
labels: ["amélioration"]
body:
  - type: dropdown
    id: domaine
    attributes:
      label: Domaine concerné
      options:
        - Électronique
        - Mécanique
        - Logiciel
        - Documentation
        - Autre
    validations:
      required: true
  - type: textarea
    id: idee
    attributes:
      label: Ton idée
      description: Que proposes-tu ?
    validations:
      required: true
  - type: textarea
    id: pourquoi
    attributes:
      label: Pourquoi ?
      description: Quel problème cela résout-il, ou qu'est-ce que cela apporte ?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives envisagées
